<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="클로드 컴패니언 — 코딩을 몰라도 Claude Code를 배우고, 따라가고, 잘 쓰게 되는 나만의 안내자">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6ef"/>
      <stop offset="1" stop-color="#faeadd"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07856"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="23" fill="none" stroke="#f0ddd0" stroke-width="3"/>

  <!-- 좌측: 로고 + 타이틀 -->
  <g transform="translate(72, 88)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#coral)"/>
    <text x="42" y="58" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="44" text-anchor="middle">🧡</text>

    <text x="108" y="44" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#3d3127">클로드 컴패니언</text>
    <text x="108" y="78" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#b08d76">Claude Companion</text>

    <text x="2" y="150" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#5c4d40">
      코딩을 몰라도 괜찮아요 —
    </text>
    <text x="2" y="188" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#5c4d40">
      <tspan fill="#d97757" font-weight="800">Claude Code</tspan>를 배우고, 따라가고, 잘 쓰게 되는
    </text>
    <text x="2" y="226" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#5c4d40">
      나만의 안내자입니다.
    </text>
  </g>

  <!-- 우측: 기능 카드 4개 -->
  <g font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
    <g transform="translate(700, 64)">
      <rect width="430" height="64" rx="16" fill="#ffffff" stroke="#f0ddd0" stroke-width="2"/>
      <text x="22" y="40" font-size="26">🎓</text>
      <text x="62" y="33" font-size="19" font-weight="700" fill="#3d3127">배우기</text>
      <text x="62" y="53" font-size="14" fill="#8a7a6e">"클로드 코드가 뭐예요?"부터 시작하는 한국어 레슨 11개</text>
    </g>
    <g transform="translate(700, 138)">
      <rect width="430" height="64" rx="16" fill="#ffffff" stroke="#f0ddd0" stroke-width="2"/>
      <text x="22" y="40" font-size="26">📰</text>
      <text x="62" y="33" font-size="19" font-weight="700" fill="#3d3127">새 소식</text>
      <text x="62" y="53" font-size="14" fill="#8a7a6e">최신 Claude 소식을 쉬운 요약으로 + 내가 고른 채널 구독</text>
    </g>
    <g transform="translate(700, 212)">
      <rect width="430" height="64" rx="16" fill="#ffffff" stroke="#f0ddd0" stroke-width="2"/>
      <text x="22" y="40" font-size="26">🧭</text>
      <text x="62" y="33" font-size="19" font-weight="700" fill="#3d3127">컴패니언</text>
      <text x="62" y="53" font-size="14" fill="#8a7a6e">작업 조언 · 피드백 리포트 · 보내기 전 요청문 다듬기</text>
    </g>
    <g transform="translate(700, 286)">
      <rect width="430" height="64" rx="16" fill="#fff4ee" stroke="#e8b09a" stroke-width="2"/>
      <text x="22" y="40" font-size="26">❓</text>
      <text x="62" y="33" font-size="19" font-weight="700" fill="#c0492a">물어보기</text>
      <text x="62" y="53" font-size="14" fill="#a3705c">어느 화면에서든 — 보던 내용을 알고 답해주는 튜터</text>
    </g>
  </g>

  <!-- 하단 캡션 -->
  <text x="74" y="352" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#b08d76">
    로컬에서만 돌아가는 웹앱 · claude -p 기반 · npm start 한 줄이면 끝
  </text>
</svg>
